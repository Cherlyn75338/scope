[package]
name = "verifier-scan"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-client = "1.16.27"
solana-sdk = "1.16.27"
solana-transaction-status = "1.16.27"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
