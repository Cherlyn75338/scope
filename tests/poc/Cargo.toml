[package]
name = "poc"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "poc"
crate-type = ["lib"]

[dev-dependencies]
solana-program-test = ">1.16.18"
solana-sdk = ">1.16.18"
solana-program = ">1.16.18"
anchor-lang = "0.28.0"
chainlink-streams-report = { git = "https://github.com/smartcontractkit/data-streams-sdk.git", package = "chainlink-data-streams-report" }
scope = { path = "../../programs/scope", default-features = false, features = ["localnet", "no-entrypoint"] }
attacker = { path = "../../programs/attacker" }
verifier = { path = "../../programs/verifier" }
decimal-wad = "0.1.7"
num-bigint = "0.4"

